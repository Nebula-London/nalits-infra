networks:
  backend:
    driver: bridge
    ipam:
      config:
      - subnet: 172.25.0.0/24
    name: rentoption-backend
  frontend:
    driver: bridge
    ipam:
      config:
      - subnet: 172.24.0.0/24
    name: rentoption-frontend
services:
  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: rentoption-certbot
    depends_on:
    - nginx
    environment:
    - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
    - CERTBOT_STAGING=${CERTBOT_STAGING:-1}
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - frontend
    restart: unless-stopped
    volumes:
    - nginx_certbot:/var/www/certbot
    - nginx_certbot_conf:/etc/letsencrypt

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Containerfile
    command: start --optimized --import-realm
    container_name: rentoption-keycloak
    environment:
    - KC_DB=${KC_DB:-oracle}
    - KC_DB_URL=${KC_DB_URL}
    - KC_DB_USERNAME=${KC_DB_USERNAME}
    - KC_DB_PASSWORD=${KC_DB_PASSWORD}
    - KC_DB_TLS_MODE=${KC_DB_TLS_MODE:-verify-server}
    - KC_HOSTNAME=${KC_HOSTNAME}
    - KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}
    - KC_HOSTNAME_STRICT_HTTPS=${KC_HOSTNAME_STRICT_HTTPS}
    - KC_HTTP_ENABLED=true
    - KC_HTTP_PORT=${KC_HTTP_PORT}
    - KC_HTTPS_PORT=${KC_HTTPS_PORT}
    - KC_PROXY=edge
    - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
    - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    - KC_LOG_LEVEL=INFO
    - KC_FEATURES=token-exchange
    - KC_CACHE=ispn
    - KC_CACHE_STACK=tcp
    - KC_METRICS_ENABLED=true
    - KC_HEALTH_ENABLED=true
    - KC_PROXY_HEADERS=xforwarded
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 120s
      test:
      - CMD-SHELL
      - bash -c 'cat < /dev/tcp/localhost/8080 </dev/null'
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - frontend
    - backend
    ports:
    - 8080:8080
    - 8443:8443
    restart: unless-stopped
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
  lam:
    build:
      context: ./lam
      dockerfile: Dockerfile
    container_name: rentoption-lam
    depends_on:
    - samba
    environment:
    - LAM_PASSWORD=${LAM_PASSWORD}
    - LAM_LANG=en_US
    - LAM_TIMEZONE=UTC
    - LAM_AUTO_CONFIG=true
    - LAM_LDAP_HOST=samba
    - LAM_LDAP_PORT=636
    - LAM_LDAP_PROTOCOL=ldaps
    - LAM_LDAP_BASE_DN=DC=RENTOPTION,DC=COM
    - LAM_LDAP_BIND_DN=CN=Administrator,CN=Users,DC=RENTOPTION,DC=COM
    - LAM_LDAP_BIND_PASS=${SAMBA_ADMIN_PASSWORD}
    - LAM_LDAP_TLS_VERIFY=false
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - backend
    ports:
    - 8081:80
    profiles:
    - internal
    restart: unless-stopped
    volumes:
    - lam_config:/var/lib/ldap-account-manager/config
    - ./lam/config/lam.conf:/var/lib/ldap-account-manager/config/lam.conf:ro
  nginx:
    container_name: rentoption-nginx
    depends_on:
    - keycloak
    environment:
    - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-auto}
    - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - nginx
      - -t
      timeout: 10s
    image: nginx:alpine
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - frontend
    - backend
    ports:
    - 80:80
    - 443:443
    restart: unless-stopped
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/conf.d:/etc/nginx/conf.d:ro
    - nginx_certbot:/var/www/certbot:ro
    - nginx_certbot_conf:/etc/letsencrypt:ro
  samba:
    build:
      context: ./samba
      dockerfile: Dockerfile
    cap_add:
    - NET_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - SYS_ADMIN
    container_name: rentoption-samba
    environment:
    - AD_DOMAIN=${AD_DOMAIN}
    - AD_REALM=${AD_REALM}
    - AD_NETBIOS=${AD_NETBIOS}
    - SAMBA_DOMAIN=${AD_NETBIOS}
    - SAMBA_REALM=${AD_REALM}
    - SAMBA_ADMIN_PASS=${SAMBA_ADMIN_PASSWORD}
    - SAMBA_DNS_FORWARDER=${SAMBA_DNS_FORWARDER}
    - SAMBA_FUNCTION=domain_controller
    - SAMBA_NETBIOS_NAME=DC1
    - SAMBA_WORKGROUP=${AD_NETBIOS}
    - SAMBA_DISABLE_PRINTERS=1
    - SAMBA_TLS_ENABLED=yes
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 120s
      test:
      - CMD
      - /scripts/healthcheck.sh
      timeout: 30s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend:
        aliases:
        - samba
        - samba.${AD_DOMAIN}
        - dc1.${AD_DOMAIN}
    ports:
    - 53:53/tcp
    - 53:53/udp
    - 88:88/tcp
    - 88:88/udp
    - 135:135/tcp
    - 137:137/udp
    - 138:138/udp
    - 139:139/tcp
    - 389:389/tcp
    - 389:389/udp
    - 445:445/tcp
    - 636:636/tcp
    - 3268:3268/tcp
    - 3269:3269/tcp
    restart: unless-stopped
    sysctls:
    - net.core.somaxconn=65535
    volumes:
    - samba_data:/var/lib/samba
    - samba_etc:/etc/samba
volumes:
  nginx_certbot:
    name: rentoption-nginx-certbot
  nginx_certbot_conf:
    name: rentoption-nginx-certbot-conf
  keycloak_data:
    name: rentoption-keycloak-data
  lam_config:
    name: rentoption-lam-config
  samba_data:
    name: rentoption-samba-data
  samba_etc:
    name: rentoption-samba-etc
