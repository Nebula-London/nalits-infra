# ===========================================
# Samba AD Domain Controller Configuration
# Generated by init-ad.sh on first run
# This file is managed by Samba - do not edit manually
# ===========================================

[global]
    workgroup = ${AD_NETBIOS}
    realm = ${AD_REALM}
    netbios name = DC1
    server role = active directory domain controller
    idmap_ldb:use rfc2307 = yes
    
    # DNS
    dns forwarder = ${SAMBA_DNS_FORWARDER}
    
    # Kerberos
    kerberos method = secrets and keytab
    dedicated keytab file = /etc/samba/dc1.keytab
    
    # LDAP
    ldap server require strong auth = no
    tls enabled = yes
    tls keyfile = /etc/samba/tls/key.pem
    tls certfile = /etc/samba/tls/cert.pem
    tls cafile = /etc/samba/tls/ca.pem
    
    # Performance
    max open files = 65535
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=524288 SO_SNDBUF=524288
    
    # Logging
    log level = 2
    log file = /var/log/samba/log.%m
    max log size = 100
    
    # Winbind
    winbind use default domain = yes
    winbind enum users = yes
    winbind enum groups = yes
    winbind nss info = rfc2307
    winbind refresh tickets = yes
    
    # VFS
    vfs objects = dfs_samba4 acl_xattr
    map acl inherit = yes
    store dos attributes = yes

# Sysvol
[sysvol]
    path = /var/lib/samba/sysvol
    read only = no

# Netlogon
[netlogon]
    path = /var/lib/samba/sysvol/${AD_REALM}/scripts
    read only = no

# IPC$
[IPC$]
    path = /tmp
    hosts allow = 172.21.0.0/24 172.20.0.0/24