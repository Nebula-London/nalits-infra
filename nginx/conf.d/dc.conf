# ===========================================
# Samba AD Management Portal — dc.rentoption.com
# Internal only — allow backend/frontend + RFC1918, deny external
# Uses existing LE certs from certs/live/dc.rentoption.com (symlink to /etc/letsencrypt)
# Reuses nginx_certbot volumes; certs synced via named volume rentoption-nginx-certbot-conf
# ===========================================

# HTTP → HTTPS redirect + ACME challenge (preserved for future renewal)
server {
    listen 80;
    listen [::]:80;
    server_name dc.rentoption.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — internal only
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dc.rentoption.com;

    ssl_certificate /etc/nginx/certs/live/dc.rentoption.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dc.rentoption.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Internal-only guard (Samba AD UI must NOT be public)
    allow 172.24.0.0/24; # rentoption-frontend
    allow 172.25.0.0/24; # rentoption-backend
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    # Docker embedded DNS for lazy upstream resolution (avoids nginx -t fail when api/ui not yet up)
    resolver 127.0.0.11 valid=30s;

    # API proxy — FastAPI (strip /api prefix: /api/health -> /health on backend)
    location /api/ {
        set $upstream_api "samba-api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend — Next.js
    location / {
        set $upstream_ui "samba-ui:3000";
        proxy_pass http://$upstream_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
